services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laundry66}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # --protocol=tcp forces a real TCP check on 3306. Without it, `mysqladmin
      # ping -h localhost` connects over the Unix socket and succeeds against
      # MySQL's internal init-only bootstrap server (which runs with
      # --skip-networking) before the real TCP listener is up — that made
      # compose mark mysql "healthy" too early and the backend's one-shot
      # schema init hit ECONNREFUSED and silently gave up (no tables created).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [laundry]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      # App auto-creates the schema on boot (idempotent) even in production —
      # see backend/database/db.js. Set to "false" once the DB is initialized
      # if you'd rather manage schema changes manually.
      DB_AUTO_INIT: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laundry66}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [laundry]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [laundry]

networks:
  laundry:

volumes:
  mysql_data:
